[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newton-fractal-lab"
version = "0.1.0"
description = "A tiny pure-Python lab for Newton fractals of z^n - 1."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jarbas"}]
license = {text = "MIT"}

[tool.setuptools]
packages = ["newton_fractal_lab"]
